---
  - name: Deploy Olympus application secret
    hosts: linux
    become: true

    tasks:
      - name: Ensure Olympus configuration directory exists
        ansible.builtin.file:
          path: /etc/olympus
          state: directory
          owner: root
          group: root
          mode: "0700"

      - name: Deploy Olympus API token securely
        ansible.builtin.copy:
          content: |
            OLYMPUS_API_TOKEN = {{ olympus_api_token }}
          dest: /etc/olympus/olympus.env
          owner: root
          group: root
          mode: "0600"
        no_log: true
        diff: false
      - name: Inspect deployed secret file metadata
        ansible.builtin.stat:
          path: /etc/olympus/olympus.env
          get_checksum: false
          get_mime: false
        register: olympus_secret_file

      - name: Validate deployed secret file security
        ansible.builtin.assert:
          that:
            - olympus_secret_file.stat.exists
            - olympus_secret_file.stat.isreg
            - olympus_secret_file.stat.pw_name == "root"
            - olympus_secret_file.stat.gr_name == "root"
            - olympus_secret_file.stat.mode == "0600"
          success_msg: Olympus secret file permissions are secure
          fail_msg: Olympus secret file permissions are not secure
